description: 'Aspire Health was a community-based palliative care provider surfaced as a portfolio
  company of GV (Google Ventures) and added to the API Evangelist network as a life-sciences stub.
  The company delivered home- and clinic-based palliative and serious-illness care and was acquired
  by Anthem (now Elevance Health) in 2018; its aspirehealthcare.com domain today redirects into the
  Carelon Health / CareMore Health palliative-care service line. Aspire Health is a healthcare
  services organization, not a technology or API provider: enrichment found no public developer
  portal, API documentation, OpenAPI specification, SDKs, or /.well-known/ discovery surface. This
  profile is retained as a network lead with only the identity and domain-security posture that could
  be verified from public probes.'
